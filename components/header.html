<header class="fixed top-0 left-0 right-0 z-50 bg-header-bg/95 backdrop-blur-sm border-b-2 border-deep-black">
  <div class="max-w-container mx-auto px-margin-mobile lg:px-margin-desktop h-20 flex items-center justify-between gap-6">

    <!-- Logo & Brand -->
    <a href="/" class="flex items-center gap-3 flex-shrink-0" aria-label="TBM Jalosi Sanak Negeri – Beranda">
      <img src="/assets/images/logo-placeholder.svg" alt="Logo TBM Jalosi" width="120" height="40"
           class="h-9 w-auto" onerror="this.style.display='none'">
      <div class="hidden sm:flex flex-col leading-none">
        <span class="font-label-stamp text-[11px] text-paper-sand uppercase tracking-[0.15em]">TBM Jalosi</span>
        <span class="font-label-mono text-[10px] text-outline-variant uppercase tracking-widest mt-0.5">Sanak Negeri</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden lg:flex items-center gap-6" aria-label="Navigasi Utama" id="main-nav">
      <a class="font-label-mono text-[12px] text-paper-sand hover:text-sticker-green uppercase tracking-widest transition-colors duration-200" href="/">Beranda</a>
      <a class="font-label-mono text-[12px] text-paper-sand hover:text-sticker-green uppercase tracking-widest transition-colors duration-200" href="/tentang">Tentang</a>
      <a class="font-label-mono text-[12px] text-paper-sand hover:text-sticker-green uppercase tracking-widest transition-colors duration-200" href="/program">Program</a>
      <a class="font-label-mono text-[12px] text-paper-sand hover:text-sticker-green uppercase tracking-widest transition-colors duration-200" href="/katalog">Katalog</a>
      <a class="font-label-mono text-[12px] text-paper-sand hover:text-sticker-green uppercase tracking-widest transition-colors duration-200" href="/pojok-karya">Pojok Karya</a>
      <a class="font-label-mono text-[12px] text-paper-sand hover:text-sticker-green uppercase tracking-widest transition-colors duration-200" href="/donasi">Donasi</a>
      <a class="font-label-mono text-[12px] text-paper-sand hover:text-sticker-green uppercase tracking-widest transition-colors duration-200" href="/kontak">Kontak</a>
    </nav>

    <!-- Hamburger Button (Mobile) -->
    <button
      id="mobile-menu-btn"
      aria-label="Buka menu navigasi"
      aria-expanded="false"
      aria-controls="mobile-menu"
      class="lg:hidden flex items-center justify-center w-10 h-10 text-paper-sand hover:text-sticker-green transition-colors"
    >
      <span class="material-symbols-outlined" id="menu-icon-open">menu</span>
      <span class="material-symbols-outlined hidden" id="menu-icon-close">close</span>
    </button>
  </div>

  <!-- Mobile Drawer -->
  <div id="mobile-menu" class="hidden lg:hidden bg-espresso-dark border-t-2 border-deep-black" role="dialog" aria-label="Menu Navigasi Mobile">
    <nav class="flex flex-col px-margin-mobile py-4 gap-1" aria-label="Navigasi Mobile">
      <a class="font-label-mono text-[13px] text-paper-sand hover:text-sticker-green hover:bg-white/5 uppercase tracking-widest px-4 py-3 rounded transition-colors" href="/">Beranda</a>
      <a class="font-label-mono text-[13px] text-paper-sand hover:text-sticker-green hover:bg-white/5 uppercase tracking-widest px-4 py-3 rounded transition-colors" href="/tentang">Tentang</a>
      <a class="font-label-mono text-[13px] text-paper-sand hover:text-sticker-green hover:bg-white/5 uppercase tracking-widest px-4 py-3 rounded transition-colors" href="/program">Program</a>
      <a class="font-label-mono text-[13px] text-paper-sand hover:text-sticker-green hover:bg-white/5 uppercase tracking-widest px-4 py-3 rounded transition-colors" href="/katalog">Katalog</a>
      <a class="font-label-mono text-[13px] text-paper-sand hover:text-sticker-green hover:bg-white/5 uppercase tracking-widest px-4 py-3 rounded transition-colors" href="/pojok-karya">Pojok Karya</a>
      <a class="font-label-mono text-[13px] text-paper-sand hover:text-sticker-green hover:bg-white/5 uppercase tracking-widest px-4 py-3 rounded transition-colors" href="/donasi">Donasi</a>
      <a class="font-label-mono text-[13px] text-paper-sand hover:text-sticker-green hover:bg-white/5 uppercase tracking-widest px-4 py-3 rounded transition-colors" href="/kontak">Kontak</a>
    </nav>
    <div class="px-margin-mobile pb-4">
      <a href="/donasi" class="block w-full text-center bg-sticker-green text-deep-black font-label-stamp text-[12px] uppercase tracking-widest px-4 py-3 border-2 border-deep-black shadow-hard-sm hover:bg-opacity-90 transition-opacity">
        Dukung Kami
      </a>
    </div>
  </div>
</header>

<!-- Header spacer -->
<div class="h-20" aria-hidden="true"></div>
